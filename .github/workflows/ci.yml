name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build -w @djs/shared-types
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run test

  e2e:
    name: API & worker e2e
    runs-on: ubuntu-latest
    needs: unit
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_dev_password
          MYSQL_DATABASE: job_scheduler
          MYSQL_USER: scheduler
          MYSQL_PASSWORD: scheduler_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_dev_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=25s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      NODE_ENV: test
      PORT: "3000"
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: mysql://scheduler:scheduler_dev@127.0.0.1:3306/job_scheduler
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      JWT_ACCESS_SECRET: ci-access-secret-min-32-characters-long!!
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters-long!
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      WORKER_CONCURRENCY: "10"
      HEARTBEAT_INTERVAL_MS: "5000"
      HEARTBEAT_TIMEOUT_MS: "15000"
      JOB_DEFAULT_TIMEOUT_MS: "30000"
      WORKER_HEALTH_PORT: "3001"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build -w @djs/shared-types
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test:e2e
