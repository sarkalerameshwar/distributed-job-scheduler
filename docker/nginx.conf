map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream djs_api {
  server api:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://djs_api/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 60s;
  }

  location /health {
    proxy_pass http://djs_api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /metrics {
    proxy_pass http://djs_api/metrics;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /docs {
    proxy_pass http://djs_api/docs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /docs-json {
    proxy_pass http://djs_api/docs-json;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Socket.IO (Phase 14 realtime) — WebSocket upgrade required
  location /socket.io/ {
    proxy_pass http://djs_api/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
