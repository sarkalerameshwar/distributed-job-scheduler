x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: mysql://${MYSQL_USER:-scheduler}:${MYSQL_PASSWORD:-scheduler_dev}@mysql:3306/${MYSQL_DATABASE:-job_scheduler}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  DB_HOST: mysql
  DB_PORT: "3306"
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-min-32-chars-long}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-min-32-chars-long}
  JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
  JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
  WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
  SHUTDOWN_GRACE_MS: ${SHUTDOWN_GRACE_MS:-30000}
  HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-5000}
  HEARTBEAT_TIMEOUT_MS: ${HEARTBEAT_TIMEOUT_MS:-15000}
  WORKER_RECOVERY_INTERVAL_MS: ${WORKER_RECOVERY_INTERVAL_MS:-15000}
  JOB_DEFAULT_TIMEOUT_MS: ${JOB_DEFAULT_TIMEOUT_MS:-30000}
  WORKER_VERSION: ${WORKER_VERSION:-0.1.0}
  JOB_LOG_RETENTION_DAYS: ${JOB_LOG_RETENTION_DAYS:-30}
  HEARTBEAT_RETENTION_DAYS: ${HEARTBEAT_RETENTION_DAYS:-7}

services:
  mysql:
    image: mysql:8.4
    container_name: djs-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-job_scheduler}
      MYSQL_USER: ${MYSQL_USER:-scheduler}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-scheduler_dev}
    ports:
      - "${MYSQL_HOST_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: djs-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256M

  migrate:
    image: djs-api:local
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: djs-migrate
    restart: "no"
    env_file:
      - .env
    environment:
      <<: *app-env
    entrypoint: ["/sbin/tini", "--"]
    command: ["/entrypoint-migrate.sh"]
    depends_on:
      mysql:
        condition: service_healthy

  api:
    image: djs-api:local
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: djs-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *app-env
      PORT: "3000"
      MIGRATE_ON_START: "false"
      SEED_ON_START: ${SEED_ON_START:-false}
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M

  worker:
    image: djs-worker:local
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    # No fixed container_name — required for `docker compose up --scale worker=N`
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *app-env
      WORKER_HEALTH_PORT: "3001"
    expose:
      - "3001"
    ports:
      - "${WORKER_HOST_PORT:-3001}:3001"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    stop_grace_period: 35s
    deploy:
      resources:
        limits:
          memory: 768M

  web:
    image: djs-web:local
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_BASE_URL: /api
    container_name: djs-web
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: djs-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana:11.2.0
    container_name: djs-grafana
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_HOST_PORT:-3002}:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  mysql_data:
  redis_data:
